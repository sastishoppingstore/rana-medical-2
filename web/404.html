.btn.primary{background:linear-gradient(135deg,var(--copper2),var(--copper));color:#fff;box-shadow:0 10px 24px rgba(148,67,13,.28)}
.btn.ghost{border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.foot{border-top:1px solid var(--line);padding:16px 24px;text-align:center;font-size:12px;color:var(--muted);background:#fff}
